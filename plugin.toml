id = "Nubinator/whatpulse-plugin"
name = "Whatpulse (UNOFFICIAL)"
version = "1.0.0"
plugin_api = 4
author = "Nubinator"
license = "MIT"
dependencies = ["websocat", "sqlite3"]
tags = ["system", "bar", "panel", "productivity", "utility"]
description = "A quick glance at your whatpulse stats"
icon = "graph"

[[setting]]
key = "websocket_port"
type = "string"
label_key = "settings.websocket_port.label"
description_key = "settings.websocket_port.description"
default = "3489"

[[setting]]
key = "polling_frequency"
type = "int"
label_key = "settings.polling_frequency.label"
description_key = "settings.polling_frequency.description"
default = 5
min = 2
max = 120


[[widget]]
id = "keypress"
entry = "./widgets/keypress_widget.luau"

[[widget]]
id = "clicks"
entry = "./widgets/clicks_widget.luau"

[[widget]]
id = "download"
entry = "./widgets/download_widget.luau"

[[widget]]
id = "upload"
entry = "./widgets/upload_widget.luau"

[[widget]]
id = "score"
entry = "./widgets/score_widget.luau"

[[widget]]
id = "scrolls"
entry = "./widgets/scrolls_widget.luau"

[[widget]]
id = "words"
entry = "./widgets/words_widget.luau"